http_port 3128
visible_hostname getdown-egress
pinger_enable off
pid_filename none
access_log none
cache_log /dev/stderr
cache_store_log none
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB
coredump_dir /tmp
forwarded_for delete
via off

acl safe_ports port 80 443
acl ssl_ports port 443
acl CONNECT method CONNECT
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl private_names dstdomain .localhost .local .internal .ts.net
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny private_names
http_access deny private_dst
http_access allow all
