services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      YT_DLP_PROXY: http://egress:3128
      DOWNLOAD_DIR: /data/downloads
      MAX_CONCURRENT_DOWNLOADS: 1
      MAX_QUEUED_DOWNLOADS: 4
      MAX_FILE_MB: 100
      MAX_DURATION_SECONDS: 1800
      JOB_TIMEOUT_SECONDS: 600
      FILE_TTL_MINUTES: 15
      TRUST_PROXY_HEADERS: 0
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /data/downloads:size=1g,uid=1000,gid=1000,mode=0700
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  ingress:
    image: nginx:1.28-alpine
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      private: {}
      dokploy-network:
        aliases: [getdown-ingress]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 64m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      app:
        condition: service_healthy
  egress:
    build:
      context: .
      dockerfile: deploy/Dockerfile.egress
    restart: unless-stopped
    networks: [private, outbound]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 128m
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  private:
    internal: true
  outbound: {}
  dokploy-network:
    external: true
